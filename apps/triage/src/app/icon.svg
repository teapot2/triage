      .check { stroke: #9f75ff; }
    }
  </style>
  <path class="ring" d="M19.61 14.47A8 8 0 0 1 14.47 19.61M9.53 19.61A8 8 0 0 1 4.39 14.47M4.39 9.53A8 8 0 0 1 9.53 4.39M14.47 4.39A8 8 0 0 1 19.61 9.53"/>
  <path class="check" d="M8.75 12.25 10.9 14.4 15.25 9.75"/>
