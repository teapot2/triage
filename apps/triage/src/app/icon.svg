<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- The Triage mark (components/triage-mark.tsx) with fixed colors: the
       vivid brand violet per theme (--brand-mark in globals.css), and a
       ring that contrasts with the tab bar. -->
  <style>
    .ring { stroke: #0b0b0b; }
