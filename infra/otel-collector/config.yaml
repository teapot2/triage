# Receive OTLP from the apps; print a summary to stdout and keep the raw
# data as OTLP JSON lines in infra/telemetry/, which Triage's live source
# reads (apps/triage/src/lib/investigation/live/). Files rotate by size so
# a long-running demo machine doesn't fill up.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s

exporters:
  debug:
    verbosity: basic
  file/traces:
    path: /telemetry/traces.jsonl
    flush_interval: 1s
    rotation: { max_megabytes: 100, max_backups: 2 }
  file/metrics:
    path: /telemetry/metrics.jsonl
    flush_interval: 1s
    rotation: { max_megabytes: 100, max_backups: 2 }
  file/logs:
    path: /telemetry/logs.jsonl
    flush_interval: 1s
    rotation: { max_megabytes: 100, max_backups: 2 }

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file/traces]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file/logs]
